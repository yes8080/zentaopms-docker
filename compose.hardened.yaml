x-hardened-logging: &hardened-logging
  driver: local
  options:
    max-size: "20m"
    max-file: "5"

services:
  mysql:
    image: ${COMPOSE_PROJECT_NAME:-zentaopms-docker}-mysql-hardened:local
    pull_policy: never
    build:
      context: ./docker
      dockerfile: mysql.hardened.Dockerfile
      secrets: [apt_ca_bundle]
    command:
      - --general-log=OFF
      - --general-log-file=/var/lib/mysql/general.log
      - --secure-file-priv=NULL
      - --local-infile=OFF
    logging: *hardened-logging
    pids_limit: 256
    mem_limit: 2g

  php:
    build:
      target: php-hardened
    user: "33:33"
    read_only: true
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    pids_limit: 128
    mem_limit: 1g
    logging: *hardened-logging
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,mode=1777
      - /var/www/zentao/tmp:rw,noexec,nosuid,nodev,uid=33,gid=33,mode=0770
    volumes:
      - app-config:/var/lib/zentao/config:ro

  nginx:
    build:
      target: nginx-hardened
    user: "101:101"
    sysctls:
      net.ipv4.ip_unprivileged_port_start: "80"
    read_only: true
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    pids_limit: 128
    mem_limit: 512m
    logging: *hardened-logging
    tmpfs:
      - /var/cache/nginx:rw,noexec,nosuid,nodev,uid=101,gid=101,mode=0700
      - /run:rw,noexec,nosuid,nodev,uid=101,gid=101,mode=0700

# With no custom CA the builder uses its distribution trust store.
secrets:
  apt_ca_bundle:
    file: ${ZENTAO_BUILD_CA_FILE:-./docker/empty-ca.pem}
