services:
  mysql:
    image: mysql:8.4@sha256:a81d043930e51745522bd5c430961cf8286f0a23f0a9a2a6e0108f7ea71b0902
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-zentao}
      MYSQL_USER: ${MYSQL_USER:-zentao}
      MYSQL_PASSWORD_FILE: /run/secrets/mysql_password
      MYSQL_ROOT_PASSWORD_FILE: /run/secrets/mysql_root_password
      MYSQL_ROOT_HOST: localhost
    secrets: [mysql_password, mysql_root_password]
    volumes:
      - mysql-data:/var/lib/mysql
    networks: [data]
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "--silent"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 30s

  php:
    build:
      context: ../zentaopms
      dockerfile: ../zentaopms-docker/docker/Dockerfile
      additional_contexts:
        deployment: ./docker
      target: php
    environment:
      IS_CONTAINER: "true"
      ZT_REQUEST_TYPE: PATH_INFO
      ZT_DB_DRIVER: mysql
      ZT_DB_PREFIX: zt_
      ZT_DEFAULT_LANG: zh-cn
      MYSQL_HOST: mysql
      MYSQL_PORT: "3306"
      MYSQL_DB: ${MYSQL_DATABASE:-zentao}
      MYSQL_USER: ${MYSQL_USER:-zentao}
    healthcheck:
      test: ["CMD", "php", "-r", "exit(@fsockopen('127.0.0.1', 9000) ? 0 : 1);"]
      timeout: 4s
      interval: 20s
      start_interval: 2s
      start_period: 15s
    networks: [web, data]
    depends_on:
      mysql:
        condition: service_healthy
    volumes:
      - app-config:/var/lib/zentao/config
      - app-backup:/var/www/zentao/tmp/backup
      - app-data:/var/www/zentao/www/data

  nginx:
    build:
      context: ../zentaopms
      dockerfile: ../zentaopms-docker/docker/Dockerfile
      additional_contexts:
        deployment: ./docker
      target: nginx
    depends_on:
      php:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-Y", "off", "-q", "-T", "3", "-O", "/dev/null", "http://127.0.0.1/favicon.ico"]
      timeout: 5s
      interval: 20s
      start_interval: 2s
      start_period: 15s
    networks: [web]
    ports:
      - "${ZENTAO_BIND:-127.0.0.1}:${ZENTAO_PORT:-8080}:80"
    volumes:
      - app-data:/var/www/zentao/www/data:ro

volumes:
  mysql-data:
  app-config:
  app-backup:
  app-data:

networks:
  web:
  data:
    internal: true

secrets:
  mysql_password:
    environment: MYSQL_PASSWORD
  mysql_root_password:
    environment: MYSQL_ROOT_PASSWORD
