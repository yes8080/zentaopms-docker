limit_req_status 429;

include fastcgi_params;
# ZenTao checks Client-IP and X-Forwarded-For before REMOTE_ADDR.
fastcgi_param HTTP_CLIENT_IP "";
fastcgi_param HTTP_X_FORWARDED_FOR $remote_addr;
fastcgi_param HTTP_X_REAL_IP $remote_addr;
fastcgi_param HTTP_X_FORWARDED_PROTO $zentao_public_scheme;
fastcgi_param HTTP_FORWARDED "";
fastcgi_param HTTP_X_FORWARDED_HOST "";
set $php_upstream php:9000;
fastcgi_pass $php_upstream;
