map "$request_method:$arg_m:$arg_f" $zentao_query_login_key {
    default "";
    "POST:user:login" $binary_remote_addr;
}

# The original URI survives the internal redirect for PATH_INFO-style links.
map "$request_method:$request_uri" $zentao_login_key {
    default $zentao_query_login_key;
    ~*^POST:/(?:index\.php/)?user-login(?:[-./?]|$) $binary_remote_addr;
    ~^POST:/api\.php/v1/tokens/?(?:\?|$) $binary_remote_addr;
}

# Paths as well as query strings can contain tokens or private filenames.
map $uri $zentao_access_route {
    default web;
    ~^/index\.php(?:/|$) app;
    ~^/api\.php(?:/|$) api;
    ~^/x\.php(?:/|$) im;
    ~^/imgproxy\.php(?:/|$) image;
    ~^/(?:data/upload|_zentao_files)/ attachment;
}

log_format zentao '$time_iso8601 $remote_addr $request_method $zentao_access_route '
                  '$status $body_bytes_sent $request_time limit=$limit_req_status';

limit_req_zone $binary_remote_addr zone=zentao_php:10m rate=10r/s;
limit_req_zone $zentao_login_key zone=zentao_login:10m rate=10r/m;
limit_req_zone $binary_remote_addr zone=zentao_attachment:10m rate=20r/s;

server {
    listen 80;
    server_name _;
    root /var/www/zentao/www;
    index index.php;
    server_tokens off;
    autoindex off;
    disable_symlinks on from=$document_root;
    client_max_body_size 16m;
    resolver 127.0.0.11 ipv6=off valid=10s;
    access_log /dev/stdout zentao;
    limit_req_log_level info;

    # The optional file trusts only the actual edge peer and can set its public scheme.
    real_ip_header X-Real-IP;
    set $zentao_public_scheme $scheme;
    include /etc/nginx/zentao-proxy/*.conf;

    add_header X-Content-Type-Options nosniff always;

    location ~* ^/adminer(?:[/.]|$) { return 404; }

    # Check hidden files before the PHP allowlist, including PATH_INFO requests.
    location ~ (?:^|/)\. { return 404; }

    location ~ ^/(?<entry>index|api|x|imgproxy)\.php(?<entry_path>/.*)?$ {
        limit_req zone=zentao_php burst=30 nodelay;
        limit_req zone=zentao_login burst=5 nodelay;
        include /etc/nginx/zentao-fastcgi.conf;
        fastcgi_param SCRIPT_FILENAME $document_root/$entry.php;
        fastcgi_param SCRIPT_NAME /$entry.php;
        fastcgi_param PATH_INFO $entry_path;
    }

    location ~* "\.(?:php[0-9]*|phps|phtml|pht|phar|cgi|pl|py|rb|sh|asp|aspx|jsp)(?:[./;]|$)" {
        return 404;
    }

    location /data/upload/ {
        # A page can request many thumbnails at once, independently of UI and API calls.
        limit_req zone=zentao_attachment burst=100 delay=40;
        limit_except GET { deny all; }
        include /etc/nginx/zentao-fastcgi.conf;
        fastcgi_param SCRIPT_FILENAME $document_root/private-upload.php;
        fastcgi_param SCRIPT_NAME /index.php;
        fastcgi_param ZENTAO_UPLOAD_URI $uri;
        add_header X-Content-Type-Options nosniff always;
        add_header Content-Security-Policy "sandbox" always;
        add_header Cache-Control "private, no-store" always;
    }

    # Only the attachment gate can select this location through X-Accel-Redirect.
    location ^~ /_zentao_files/ {
        internal;
        alias /var/www/zentao/www/data/upload/;
        disable_symlinks on from=/var/www/zentao/www;
        default_type application/octet-stream;
        add_header X-Content-Type-Options nosniff always;
        add_header Content-Security-Policy "sandbox" always;
        add_header Cache-Control "private, no-store" always;
    }

    location /data/ {
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }
}
