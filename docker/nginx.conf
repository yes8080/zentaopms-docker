server {
    listen 80;
    server_name _;
    root /var/www/zentao/www;
    index index.php;
    client_max_body_size 16m;
    resolver 127.0.0.11 ipv6=off valid=10s;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ ^/(?<entry>[a-zA-Z][a-zA-Z0-9]*\.php)(?<entry_path>/.*)?$ {
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root/$entry;
        fastcgi_param SCRIPT_NAME /$entry;
        fastcgi_param PATH_INFO $entry_path;
        set $php_upstream php:9000;
        fastcgi_pass $php_upstream;
    }

    location ~* (?:^|/)\.|\.php(?:/|$) {
        return 404;
    }
}
