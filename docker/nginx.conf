log_format zentao_access '$remote_addr [$time_local] $request_method $uri $status $body_bytes_sent $request_time';

server {
    listen 80;
    access_log /var/log/nginx/access.log zentao_access;
    server_name _;
    root /var/www/zentao/www;
    index index.php;
    client_max_body_size 16m;
    resolver 127.0.0.11 ipv6=off valid=10s;

    # Authorize historical attachment and inline image URLs through ZenTao.
    location /data/upload/ {
        rewrite ^ /index.php/file-read-0.html?m=file&f=read&fileID=0? last;
    }

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ ^/(?<entry>[a-zA-Z][a-zA-Z0-9]*\.php)(?<entry_path>/.*)?$ {
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root/$entry;
        fastcgi_param SCRIPT_NAME /$entry;
        fastcgi_param PATH_INFO $entry_path;
        set $php_upstream php:9000;
        fastcgi_pass $php_upstream;
    }

    location ~* (?:^|/)\.|\.php(?:/|$) {
        return 404;
    }
}
